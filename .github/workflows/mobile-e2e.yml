name: Mobile E2E

# Maestro end-to-end suite against a release APK on an Android emulator.
# Expensive (~emulator + gradle), so PRs only pay for it when they opt in
# with the "e2e" label; workflow_dispatch always runs.
on:
  workflow_dispatch:
  pull_request:
    # "labeled" is not in the default pull_request types — without it, adding
    # the "e2e" label to an open PR would never trigger a run.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"

permissions:
  contents: read

jobs:
  e2e:
    name: build apk · emulator · maestro
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Label gate: mobile PRs don't pay the emulator tax by default.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')

    env:
      # Inlined into the JS bundle by Metro during assembleRelease
      # (EXPO_PUBLIC_* build-time substitution) — the E2E build talks to prod.
      EXPO_PUBLIC_API_URL: https://api.tilth.market
      # Dummy value, NOT a secret. app.config.js injects this into the
      # AndroidManifest for react-native-maps; the config does not hard-fail
      # when the var is absent (expo config-plugins just omits the meta-data),
      # but a placeholder keeps the manifest shape stable. Map flows are out
      # of scope for E2E v1 — promote to a repo secret when they land.
      GOOGLE_MAPS_ANDROID_KEY: e2e-dummy-key-map-flows-out-of-scope

    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted Linux runners expose /dev/kvm but gate it behind the kvm
      # group; without this the emulator falls back to unusably slow software
      # emulation (and android-emulator-runner times out).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Expo SDK 56 / react-native 0.85 (AGP 8.x) builds require JDK 17 —
      # matches the React Native environment-setup requirement and Expo's own
      # SDK 56 build images.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates apps/mobile/android/ from app.json + app.config.js.
      # --no-install: deps are already installed via pnpm above.
      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # After prebuild so the generated gradle wrapper file exists when
      # hashFiles() is evaluated at step run time.
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Expo's generated android project signs the release buildType with the
      # debug keystore by default, so this APK installs cleanly on an emulator
      # without any signing secrets.
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@e93c997dcab69054e999e3924af3d21c4a736e13 # v2.9.0
        env:
          # Read by the get.maestro.mobile.dev install script — pins the CLI.
          MAESTRO_VERSION: 2.8.0
          # Maestro auto-injects MAESTRO_-prefixed host env vars into flows.
          MAESTRO_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          MAESTRO_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro --version
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test apps/mobile/.maestro/

      # Maestro writes per-run screenshots + logs under ~/.maestro/tests.
      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7
