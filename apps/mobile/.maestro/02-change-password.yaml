# 02-change-password.yaml — F-055 mobile E2E harness.
#
# Covers Settings > Account > Change password (F-051), end to end: changes
# the 🧪 e2e-runner password to a derived value, signs out, logs back in with
# the NEW password (proves the change took), then changes it back and logs in
# again with the ORIGINAL password — so this flow is idempotent and the
# MAESTRO_TEST_PASSWORD GitHub secret stays valid across runs.
#
# The derived password is ${MAESTRO_TEST_PASSWORD} + a literal "-x" suffix —
# never a second secret, just a deterministic transform of the injected one.
appId: market.tilth.app
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
# launchApp COLD-STARTS the app: the gear renders before React Navigation
# finishes mounting, so a tap ~1s in gets swallowed (runs 31185995079,
# 31188990644: gear tapped, no navigation). Wait for the tab bar — the
# last thing to mount — before tapping.
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
# Gear tap centre falls inside the emulator status-bar window (run
# 31191892606 hierarchy dump) — tap its lower half instead.
- tapOn:
    point: "91%,6%"
# Confirm we actually LEFT Home instead of assuming the tap landed.
- extendedWaitUntil:
    visible: "Account"
    timeout: 15000

# --- Change password: original -> original-x -----------------------------
- tapOn: "Change password"
- tapOn:
    id: "change-password-current-input"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn:
    id: "change-password-new-input"
- inputText: "${MAESTRO_TEST_PASSWORD}-x"
- tapOn:
    id: "change-password-confirm-input"
- inputText: "${MAESTRO_TEST_PASSWORD}-x"
- tapOn: "Update password"

# ChangePasswordScreen shows a native Alert("Password changed", …, [OK]) on
# success (auth.changePassword is a real network call — give it room), then
# navigation.goBack() returns to Settings.
- extendedWaitUntil:
    visible: "Password changed"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Settings"

# --- Sign out, log back in with the NEW password --------------------------
- tapOn: "Sign out"
- assertVisible: "Log In"
- tapOn: "Log In"
- tapOn:
    id: "login-username-input"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "${MAESTRO_TEST_PASSWORD}-x"
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000

# --- Change it back: original-x -> original --------------------------------
# Gear tap centre falls inside the emulator status-bar window (run
# 31191892606 hierarchy dump) — tap its lower half instead.
- tapOn:
    point: "91%,6%"
- tapOn: "Change password"
- tapOn:
    id: "change-password-current-input"
- inputText: "${MAESTRO_TEST_PASSWORD}-x"
- tapOn:
    id: "change-password-new-input"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn:
    id: "change-password-confirm-input"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn: "Update password"
- extendedWaitUntil:
    visible: "Password changed"
    timeout: 15000
- tapOn: "OK"
- assertVisible: "Settings"

# --- Sign out, re-login with the ORIGINAL password — confirms the revert
# worked and leaves the account (and the GH secret) exactly as this run found
# it, idempotent for the next CI run. -------------------------------------
- tapOn: "Sign out"
- assertVisible: "Log In"
- tapOn: "Log In"
- tapOn:
    id: "login-username-input"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn:
    id: "login-password-input"
- inputText: "${MAESTRO_TEST_PASSWORD}"
- tapOn:
    id: "login-submit-button"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
# Header "Tilth" is a logo image, not text — anchor on the tab bar.
- assertVisible: "Home"
