#   2. tapOn the search box -> inputText "Tilth Test Stand" (or a produce
#      name from TEST_LISTINGS, e.g. "Test Tomatoes")
#   3. tapOn the "🧪 Tilth Test Stand" result -> StoreProfile
#   4. tapOn "Message" -> Conversation screen
#   5. tapOn the composer -> inputText "e2e block test" -> tapOn the send
