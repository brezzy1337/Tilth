# TODO (v1 gap): drive the full block/unblock loop against the 🧪 test stand.
#
# Why this isn't wired up yet:
#   - Reaching the test stand's StoreProfile from the e2e-runner account
#     requires either the Home map/sheet or Search — BOTH are gated behind
#     `useDeviceLocation` (src/location/useDeviceLocation.ts), which calls
#     `Location.getCurrentPositionAsync`. On a CI Android emulator this
#     resolves to whatever fix the emulator/CI config gives it (commonly the
#     AVD's default mock location, e.g. Mountain View, ~37.42,-122.09) unless
#     the workflow explicitly sets one (`adb emu geo fix <lng> <lat>`) —
#     which apps/mobile/.maestro does not control.
#   - The test stand's location is whatever `--lat`/`--lng` was passed to
#     `pnpm test-accounts seed` (apps/server/scripts/test-accounts.ts) —
#     there's no fixed, known-good coordinate in this repo to assert against,
#     and Home's nearby radius is 25 km / Search's is 50 km, so an emulator
#     default location landing outside that radius would silently break the
#     flow with an empty result list rather than a clear failure.
#   - There is no stable deep link / storeId to jump straight to
#     StoreProfile — it has to be discovered via a location-dependent query.
#
# Once the mobile-e2e workflow pins the emulator's location to a fixed point
# known to be within range of the seeded 🧪 test stand (e.g. `adb emu geo fix`
# in .github/workflows/mobile-e2e.yml, matching the coords used for
# `pnpm test-accounts seed`), this flow can add:
