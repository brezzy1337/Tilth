# 03-blocked-users.yaml — F-055 mobile E2E harness.
#
# Covers Settings > Privacy > Blocked users (F-051) as far as can be driven
# reliably in CI. The full checklist item — start a fresh conversation with
# the 🧪 test stand (apps/server/scripts/test-accounts.ts: store "🧪 Tilth
# Test Stand", tilth_test_stand), send a message, block from the thread,
# assert the block shows up here, unblock, assert the list empties — is
# deliberately NOT automated in v1. See the TODO block below for why, and
# what would need to be true to turn it on.
#
# What IS covered here: Settings > Privacy > Blocked users renders, regardless
# of whether the list is empty or has entries left over from a previous
# partial run (asserts the screen's nav header title, which is
# state-independent — see App.tsx: AuthedStack.Screen name="BlockedUsers"
# options={{ title: "Blocked Users" }} — rather than the empty-state copy).
appId: market.tilth.app
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
# launchApp COLD-STARTS the app: the gear renders before React Navigation
# finishes mounting, so a tap ~1s in gets swallowed (runs 31185995079,
# 31188990644: gear tapped, no navigation). Wait for the tab bar — the
# last thing to mount — before tapping.
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- tapOn: "Settings"
# Confirm we actually LEFT Home instead of assuming the tap landed.
- extendedWaitUntil:
    visible: "Account"
    timeout: 15000
- tapOn: "Blocked users"
- extendedWaitUntil:
    visible: "Blocked Users"
    timeout: 15000
- assertVisible: "Blocked Users"
- back
- assertVisible: "Settings"

