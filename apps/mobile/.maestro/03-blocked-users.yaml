#   6. tapOn "Conversation options" (header overflow, accessibilityLabel) ->
#      tapOn "Block user" -> tapOn "Block" (native Alert confirm)
#   7. assertVisible "Settings" (blockUser.onSuccess navigates back)
#   8. tapOn "Settings" -> tapOn "Blocked users" -> assertVisible the test
